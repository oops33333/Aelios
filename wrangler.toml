name = "aelios"
account_id = "60d6f22af1c7502b6ea16028a3823136"
main = "src/index.ts"
compatibility_date = "2026-04-01"
keep_vars = true

[triggers]
crons = ["10 20 * * *"]

[vars]
CLOUDFLARE_API_TOKEN = ""
PUBLIC_MODEL_NAME = "companion"
ALLOW_MODEL_PASSTHROUGH = "true"

# ─── 模型配置（走 OpenRouter）───
# OpenRouter 格式的模型名称
# 聊天主模型（$0.435/M input, $0.87/M output）
CHAT_MODEL = "deepseek/deepseek-v4-pro"
# 记忆提取/整理用的模型（免费，省钱）
SUMMARY_MODEL = "deepseek/deepseek-v4-flash:free"
# 视觉模型
VISION_MODEL = "minimax/minimax-m3"

# ─── 记忆过滤（仍走 Workers AI，免费）───
MEMORY_FILTER_MODEL = "workers-ai/@cf/meta/llama-3.3-70b-instruct-fp8-fast"
MEMORY_FILTER_MAX_CANDIDATES = "12"
MEMORY_FILTER_MAX_OUTPUT = "4"
MEMORY_FILTER_MAX_CONTENT_CHARS = "700"
MEMORY_FILTER_OUTPUT_CHARS = "300"
MEMORY_FILTER_MAX_TOKENS = "1400"
MEMORY_FILTER_MIN_SCORE = "0.35"

# ─── 记忆后端配置 ───
# 设为 d1 使搜索路径走 searchMemoriesByText（现已改为调 sweepy）
MEMORY_BACKEND = "d1"
MEMORY_MIN_SCORE = "0.35"
MEMORY_TOP_K = "12"

# ─── sweepy 记忆库 ───
SWEEPY_URL = "https://sweepy.cloud"
AI_GATEWAY_BASE_URL = "https://gateway.ai.cloudflare.com/v1/60d6f22af1c7502b6ea16028a3823136/default"
# SWEEPY_AUTH 放在 Cloudflare Dashboard Secrets 里：SET_IN_DASHBOARD

# ─── embedding 由 sweepy 处理，以下仅为兼容保留 ───
EMBEDDING_MODEL = "workers-ai/@cf/google/embeddinggemma-300m"
EMBEDDING_DIMENSIONS = "768"

# ─── 记忆提取配置 ───
ENABLE_INCREMENTAL_MEMORY = "true"
ENABLE_DAILY_MEMORY_DIGEST = "true"
DAILY_DIGEST_TIME_ZONE = "Asia/Shanghai"
DAILY_DIGEST_MAX_RUNS = "3"
DAILY_DIGEST_MAX_TOKENS = "5000"
ENABLE_DAILY_SUMMARY_MEMORY = "false"

# ─── 对话历史压缩 ───
# 此前从未启用：开关只存在于 src/memory/compress.ts，wrangler.toml/dashboard 均未设置，
# 导致历史无限累积（2026-07 排查：缓存前缀单窗口涨到 69k tokens）。
ENABLE_HISTORY_COMPRESSION = "true"
# 摘要目标字数。硬上限是代码里的 max_tokens: 2000，中文 2000 字会超出被截断，
# 故设 1200 字（约 1500-1800 tokens）留出余量。
HISTORY_COMPRESS_MAX_CHARS = "1000"

# ─── Anthropic 缓存 ───
ANTHROPIC_THINKING_ENABLED = ""
ANTHROPIC_THINKING_BUDGET = "1024"
ANTHROPIC_CACHE_ENABLED = "true"
ANTHROPIC_AUTO_CACHE_ENABLED = "false"
ANTHROPIC_ROLLING_CACHE_ENABLED = "true"
ANTHROPIC_CACHE_TTL = "1h"
CUSTOM_ANTHROPIC_MESSAGES_PATH = "messages"

# ─── Secrets（在 Cloudflare Dashboard 设置，不要写在这里）───
# OPENROUTER_API_KEY = "sk-or-..."
# SWEEPY_AUTH = "SET_IN_DASHBOARD"
# CHATBOX_API_KEY, MEMORY_MCP_API_KEY, GUIDE_DOG_API_KEY
# AI_GATEWAY_BASE_URL（如果 MEMORY_FILTER_MODEL 需要 Workers AI）
[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true

[ai]
binding = "AI"

# ─── Vectorize 已移除，由 sweepy 向量搜索替代 ───
# [[vectorize]]
# binding = "VECTORIZE"
# index_name = "memo-kb"

[[queues.producers]]
binding = "MEMORY_QUEUE"
queue = "companion-memory"

[[queues.consumers]]
queue = "companion-memory"
max_batch_size = 10
max_batch_timeout = 30
